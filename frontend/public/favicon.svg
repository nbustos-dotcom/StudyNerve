<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Node fill: violet highlight → indigo base -->
    <radialGradient id="ng" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="60%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>

    <!--
      Glow: blur the rendered nodes, then composite the sharp original
      back on top so the halo shows around each circle.
      filterUnits="userSpaceOnUse" lets us use absolute px coordinates
      covering the full 32×32 canvas so no clipping at edges.
    -->
    <filter id="glow" x="0" y="0" width="32" height="32" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feComposite  in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!--
    Six connection lines forming an asymmetric network.
    Nodes:  A(7,9)  B(25,7)  C(16,16-hub)  D(5,25)  E(26,25)  F(19,5)
    Edges:  F-B  A-C  B-C  C-D  C-E  A-D  B-E
  -->
  <g stroke="#818cf8" stroke-opacity="0.55" stroke-width="0.9"
     stroke-linecap="round" fill="none">
    <!-- cross-layer edges -->
    <line x1="19" y1="5"  x2="25" y2="7"/>   <!-- F – B -->
    <line x1="7"  y1="9"  x2="16" y2="16"/>  <!-- A – C -->
    <line x1="25" y1="7"  x2="16" y2="16"/>  <!-- B – C -->
    <line x1="16" y1="16" x2="5"  y2="25"/>  <!-- C – D -->
    <line x1="16" y1="16" x2="26" y2="25"/>  <!-- C – E -->
    <!-- skip-layer edges (give it that net feel) -->
    <line x1="7"  y1="9"  x2="5"  y2="25"/>  <!-- A – D -->
    <line x1="25" y1="7"  x2="26" y2="25"/>  <!-- B – E -->
  </g>

  <!--
    Nodes – centre hub (C) is slightly larger to anchor the composition.
    All filled with the same gradient; glow filter applied to the group.
  -->
  <g fill="url(#ng)" filter="url(#glow)">
    <circle cx="19" cy="5"  r="2.2"/>  <!-- F – top accent -->
    <circle cx="7"  cy="9"  r="2.5"/>  <!-- A – upper left -->
    <circle cx="25" cy="7"  r="2.5"/>  <!-- B – upper right -->
    <circle cx="16" cy="16" r="3.1"/>  <!-- C – centre hub -->
    <circle cx="5"  cy="25" r="2.5"/>  <!-- D – lower left -->
    <circle cx="26" cy="25" r="2.5"/>  <!-- E – lower right -->
  </g>
</svg>
