s=\"ic\"><\u002Fspan>Subjects<\u002Fdiv>\n      <div class=\"value\">4<\u002Fdiv>\n      <div class=\"delta\">All active this week<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"label\"><span class=\"ic\"><\u002Fspan>Notes<\u002Fdiv>\n      <div class=\"value\">12<\u002Fdiv>\n      <div class=\"delta\">+3 since Monday<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"label\"><span class=\"ic\"><\u002Fspan>Accuracy<\u002Fdiv>\n      <div class=\"value\">78<span class=\"unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"delta\">+4% vs. last week<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"label\"><span class=\"ic\"><\u002Fspan>Streak<\u002Fdiv>\n      <div class=\"value\">5<span class=\"unit\">days<\u002Fspan><\u002Fdiv>\n      <div class=\"delta\">Personal best ahead<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hint\"><span class=\"pulse\"><\u002Fspan>Live · drag to rotate<\u002Fdiv>\n  <div class=\"timecode\" id=\"tc\">T+00:00:00<\u002Fdiv>\n\n\n<\u002Fdiv>\n\n<script>\n/* =========================================================================\n   STUDYNERVE — STUDY UNIVERSE\n   Canvas-rendered cinematic galaxy.\n   - Procedural sun surfaces (granulation + corona + flares)\n   - Textured planets (bands / noise / clouds / atmospheres / specular)\n   - Real Keplerian-style elliptical orbits w/ Newtonian speed-up at perihelion\n   - Galactic backdrop: nebula clouds, dust lanes, 2 layers of parallax stars\n   ========================================================================= */\n(() => {\n  const canvas = document.getElementById('sky');\n  const ctx = canvas.getContext('2d', { alpha: true });\n  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);\n\n  // ───── Math helpers ─────\n  const TAU = Math.PI * 2;\n  const lerp = (a,b,t) => a + (b-a)*t;\n  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;\n  function hexA(hex, a) {\n    if (typeof hex !== 'string') return `rgba(255,255,255,${a})`;\n    if (hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;\n    let h = hex.replace('#','');\n    if (h.length === 3) h = h.split('').map(c=>c+c).join('');\n    const r = parseInt(h.substr(0,2),16);\n    const g = parseInt(h.substr(2,2),16);\n    const b = parseInt(h.substr(4,2),16);\n    return `rgba(${r},${g},${b},${a})`;\n  }\n  // seedable RNG\n  function mulberry32(a) {\n    return function() {\n      a |= 0; a = a + 0x6D2B79F5 | 0;\n      let t = Math.imul(a ^ a >>> 15, 1 | a);\n      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n      return ((t ^ t >>> 14) >>> 0) / 4294967296;\n    }\n  }\n\n  // ─────────────────── DATA ───────────────────\n  // Suns. mass affects gravity → orbital speed (Kepler's 3rd: T ~ a^1.5/sqrt(M))\n  const subjects = [\n    { name:'Mathematics', color:'#fbbf24', deep:'#b45309', halo:'#f59e0b', accent:'#fff8e1', radius:34, mass:1.20, surfTemp:0.95, pulseT:9.3 },\n    { name:'Physics',     color:'#f97316', deep:'#9a3412', halo:'#ea580c', accent:'#ffe4cc', radius:42, mass:1.55, surfTemp:0.78, pulseT:11.7 },\n    { name:'Literature',  color:'#a78bfa', deep:'#5b21b6', halo:'#8b5cf6', accent:'#ede9fe', radius:30, mass:0.95, surfTemp:0.55, pulseT:7.6 },\n    { name:'Chemistry',   color:'#22d3ee', deep:'#155e75', halo:'#06b6d4', accent:'#cffafe', radius:36, mass:1.05, surfTemp:0.70, pulseT:13.2 },\n  ];\n  // Sun layout (system center positions, normalized, offset from canvas center)\n  const sunLayout = [\n    { nx:-0.30, ny:-0.18 }, // Math: upper-left\n    { nx: 0.32, ny: 0.16 }, // Physics: lower-right\n    { nx:-0.32, ny: 0.22 }, // Literature: lower-left\n    { nx: 0.28, ny:-0.22 }, // Chemistry: upper-right\n  ];\n\n  // Planets — Keplerian. a = semi-major axis (px), e = eccentricity, ω = argument of periapsis (rotation of ellipse), incCos = vertical squash to fake inclination\n  // M0 = mean anomaly at t=0 (phase)\n  const planets = [\n    // Mathematics (3)\n    { sun:0, a: 70,  e:0.18, w: 0.35, inc:0.78, M0:0.2,  size:11,  hue:'#fde68a', deep:'#3b2f08', kind:'rocky',   ring:false },\n    { sun:0, a:115,  e:0.06, w: 1.20, inc:0.62, M0:1.6,  size:16,  hue:'#fcd34d', deep:'#3a2606', kind:'gas',     ring:true,  ringColor:'#fbbf24' },\n    { sun:0, a:165,  e:0.22, w:-0.50, inc:0.85, M0:3.2,  size:12,  hue:'#fef3c7', deep:'#1f1804', kind:'icy',     ring:false },\n    // Physics (3)\n    { sun:1, a: 82,  e:0.10, w: 0.80, inc:0.72, M0:0.5,  size:13,  hue:'#fdba74', deep:'#3a1c05', kind:'rocky',   ring:false },\n    { sun:1, a:135,  e:0.12, w:-0.30, inc:0.55, M0:2.1,  size:19,  hue:'#fb923c', deep:'#3a1804', kind:'gas',     ring:true,  ringColor:'#f97316' },\n    { sun:1, a:200,  e:0.30, w: 1.55, inc:0.80, M0:4.2,  size:12,  hue:'#fed7aa', deep:'#2e1605', kind:'rocky',   ring:false },\n    // Literature (3)\n    { sun:2, a: 65,  e:0.08, w: 1.10, inc:0.66, M0:1.0,  size:10,  hue:'#ddd6fe', deep:'#1f1238', kind:'rocky',   ring:false },\n    { sun:2, a:108,  e:0.16, w:-1.10, inc:0.78, M0:2.7,  size:14,  hue:'#c4b5fd', deep:'#211438', kind:'icy',     ring:false },\n    { sun:2, a:155,  e:0.05, w: 0.20, inc:0.50, M0:0.4,  size:14,  hue:'#a78bfa', deep:'#1c0f3a', kind:'gas',     ring:true,  ringColor:'#a78bfa' },\n    // Chemistry (3)\n    { sun:3, a: 75,  e:0.20, w: 0.55, inc:0.70, M0:2.9,  size:12,  hue:'#a5f3fc', deep:'#072b30', kind:'icy',     ring:false },\n    { sun:3, a:122,  e:0.07, w:-0.70, inc:0.60, M0:0.9,  size:17,  hue:'#67e8f9', deep:'#062a32', kind:'gas',     ring:false },\n    { sun:3, a:175,  e:0.14, w: 1.80, inc:0.82, M0:3.5,  size:11,  hue:'#22d3ee', deep:'#04222a', kind:'rocky',   ring:true,  ringColor:'#22d3ee' },\n  ];\n\n  // ─────────────────── PRE-RENDERED LAYERS ───────────────────\n  // Star layers, nebula, sun textures, planet textures.\n\n  let nebulaCanvas = null;\n  let starsBack = null, starsFront = null;\n  let starsBackData = [], starsFrontData = []; // for twinkle\n  let constellations = [];\n\n  // Cached procedural textures, keyed by sun/planet index\n  const sunTextures = []; // canvases per subject\n  const planetTextures = []; // canvases per planet (full-disk pre-shaded)\n\n  function resize() {\n    W = window.innerWidth;\n    H = window.innerHeight;\n    canvas.width = W * DPR;\n    canvas.height = H * DPR;\n    canvas.style.width = W + 'px';\n    canvas.style.height = H + 'px';\n    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    rebuildBackground();\n    rebuildSuns();\n    rebuildPlanets();\n  }\n\n  function rebuildBackground() {\n    buildNebula();\n    buildStars();\n  }\n\n  // ─── Nebula ───────────────────────────────────────────────\n  function buildNebula() {\n    nebulaCanvas = document.createElement('canvas');\n    nebulaCanvas.width = W; nebulaCanvas.height = H;\n    const c = nebulaCanvas.getContext('2d');\n    const rng = mulberry32(7);\n\n    // Big diffuse galactic clouds (purple/indigo/cyan)\n    const clouds = [\n      { x: W*0.30, y: H*0.32, r: Math.max(W,H)*0.65, color:'rgba(99,102,241,1)',  a:0.045 },\n      { x: W*0.78, y: H*0.62, r: Math.max(W,H)*0.60, color:'rgba(167,139,250,1)', a:0.040 },\n      { x: W*0.55, y: H*0.18, r: Math.max(W,H)*0.45, color:'rgba(34,211,238,1)',  a:0.022 },\n      { x: W*0.20, y: H*0.78, r: Math.max(W,H)*0.40, color:'rgba(244,114,182,1)', a:0.018 },\n    ];\n    clouds.forEach(cl => {\n      const g = c.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, cl.r);\n      g.addColorStop(0,    cl.color.replace('1)', cl.a + ')'));\n      g.addColorStop(0.45, cl.color.replace('1)', (cl.a*0.45) + ')'));\n      g.addColorStop(1,    'rgba(0,0,0,0)');\n      c.fillStyle = g;\n      c.fillRect(0,0,W,H);\n    });\n\n    // Wispy filament strokes (very subtle)\n    c.globalCompositeOperation = 'lighter';\n    for (let i=0; i<28; i++) {\n      const x = rng()*W, y = rng()*H;\n      const len = 80 + rng()*260;\n      const ang = rng()*TAU;\n      const grad = c.createLinearGradient(x, y, x+Math.cos(ang)*len, y+Math.sin(ang)*len);\n      const c1 = ['99,102,241','167,139,250','34,211,238','244,114,182'][Math.floor(rng()*4)];\n      grad.addColorStop(0, `rgba(${c1},0)`);\n      grad.addColorStop(0.5, `rgba(${c1},0.04)`);\n      grad.addColorStop(1, `rgba(${c1},0)`);\n      c.strokeStyle = grad;\n      c.lineWidth = 18 + rng()*40;\n      c.beginPath();\n      c.moveTo(x, y);\n      c.quadraticCurveTo(x+Math.cos(ang)*len*0.5 + (rng()-0.5)*120, y+Math.sin(ang)*len*0.5 + (rng()-0.5)*120, x+Math.cos(ang)*len, y+Math.sin(ang)*len);\n      c.stroke();\n    }\n    c.globalCompositeOperation = 'source-over';\n\n    // Dust grain\n    c.globalAlpha = 0.05;\n    for (let i=0; i<900; i++) {\n      const x = rng()*W, y = rng()*H;\n      c.fillStyle = ['rgba(167,139,250,1)','rgba(99,102,241,1)','rgba(255,255,255,1)'][Math.floor(rng()*3)];\n      c.fillRect(x, y, 1, 1);\n    }\n    c.globalAlpha = 1;\n  }\n\n  // ─── Stars ────────────────────────────────────────────────\n  function makeStarLayer(count, sizeMul, brightnessBias) {\n    const list = [];\n    for (let i=0; i<count; i++) {\n      const b = Math.pow(Math.random(), brightnessBias);\n      list.push({\n        x: Math.random()*W,\n        y: Math.random()*H,\n        r: (0.4 + Math.random()*1.4) * sizeMul,\n        b: 0.20 + b*0.80,\n        tw: Math.random()*TAU,\n        tws: 0.4 + Math.random()*1.2,\n        tint: Math.random() < 0.14\n          ? (Math.random()<0.5 ? '#c7d2fe' : '#fde68a')\n          : '#ffffff'\n      });\n    }\n    return list;\n  }\n\n  function buildStars() {\n    const area = W * H;\n    const back = Math.max(180, Math.floor(area / 5800));\n    const front = Math.max(80,  Math.floor(area / 12000));\n    starsBackData = makeStarLayer(back, 0.7, 2.6);\n    starsFrontData = makeStarLayer(front, 1.3, 1.6);\n\n    // constellation chains using bright front stars\n    constellations = [];\n    const bright = starsFrontData.map((s,i)=>({s,i})).filter(o=>o.s.b>0.6);\n    for (let k=0; k<5; k++) {\n      const seed = bright[Math.floor(Math.random()*bright.length)];\n      if (!seed) break;\n      const radius = Math.min(W,H)*0.18;\n      const near = bright\n        .map(o => ({ i:o.i, d: Math.hypot(o.s.x-seed.s.x, o.s.y-seed.s.y) }))\n        .filter(o => o.d < radius)\n        .sort((a,b)=>a.d-b.d)\n        .slice(0, 4 + Math.floor(Math.random()*4))\n        .map(o=>o.i);\n      if (near.length>=3) constellations.push(near);\n    }\n  }\n\n  // ─── SUN TEXTURE ─────────────────────────────────────────\n  // Procedurally generated photosphere with granulation + sunspots,\n  // baked once per subject onto a square canvas (radius*8 each side).\n  function rebuildSuns() {\n    sunTextures.length = 0;\n    subjects.forEach((sub, i) => {\n      sunTextures.push(buildSunTexture(sub, i));\n    });\n  }\n\n  function buildSunTexture(sub, idx) {\n    const R = Math.round(sub.radius);\n    const size = R * 12; // big enough to include corona\n    const c = document.createElement('canvas');\n    c.width = c.height = size;\n    const cx = size/2, cy = size/2;\n    const g = c.getContext('2d');\n    const rng = mulberry32(idx*9173 + 13);\n\n    // ─ outer corona (drawn additively with several radial gradients)\n    g.globalCompositeOperation = 'lighter';\n    for (let layer = 0; layer < 3; layer++) {\n      const rad = R * (5.2 + layer*1.6);\n      const gr = g.createRadialGradient(cx, cy, R*0.6, cx, cy, rad);\n      gr.addColorStop(0, hexA(sub.halo, 0.20 - layer*0.05));\n      gr.addColorStop(0.4, hexA(sub.color, 0.08 - layer*0.02));\n      gr.addColorStop(1, 'rgba(0,0,0,0)');\n      g.fillStyle = gr;\n      g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fill();\n    }\n\n    // corona streamers (faint radial spikes)\n    for (let i=0; i<26; i++) {\n      const ang = rng()*TAU;\n      const len = R * (3 + rng()*2.5);\n      const w = R * (0.18 + rng()*0.5);\n      g.save();\n      g.translate(cx, cy);\n      g.rotate(ang);\n      const lg = g.createLinearGradient(0, 0, len, 0);\n      lg.addColorStop(0, hexA(sub.accent, 0.18));\n      lg.addColorStop(0.4, hexA(sub.color, 0.06));\n      lg.addColorStop(1, 'rgba(0,0,0,0)');\n      g.fillStyle = lg;\n      g.beginPath();\n      g.moveTo(0, -w*0.5);\n      g.lineTo(len, -w*0.05);\n      g.lineTo(len, w*0.05);\n      g.lineTo(0, w*0.5);\n      g.closePath();\n      g.fill();\n      g.restore();\n    }\n\n    // ─ flares / prominences (curved arcs at the limb)\n    for (let i=0; i<5; i++) {\n      const ang = rng()*TAU;\n      const baseR = R * 1.0;\n      const peakR = R * (1.25 + rng()*0.55);\n      const span = 0.18 + rng()*0.35;\n      g.save();\n      g.translate(cx, cy);\n      g.rotate(ang);\n      const flare = g.createRadialGradient(peakR, 0, 0, peakR, 0, R*0.6);\n      flare.addColorStop(0, hexA(sub.accent, 0.55));\n      flare.addColorStop(0.4, hexA(sub.color, 0.25));\n      flare.addColorStop(1, 'rgba(0,0,0,0)');\n      g.fillStyle = flare;\n      g.beginPath();\n      g.moveTo(Math.cos(-span)*baseR, Math.sin(-span)*baseR);\n      g.quadraticCurveTo(peakR*1.1, 0, Math.cos(span)*baseR, Math.sin(span)*baseR);\n      g.lineTo(Math.cos(span*0.7)*(baseR*0.85), Math.sin(span*0.7)*(baseR*0.85));\n      g.quadraticCurveTo(peakR*0.6, 0, Math.cos(-span*0.7)*(baseR*0.85), Math.sin(-span*0.7)*(baseR*0.85));\n      g.closePath();\n      g.fill();\n      g.restore();\n    }\n\n    // ─ photosphere disk (granulation)\n    // we draw a clipped circle and fill with many small radial blobs\n    g.globalCompositeOperation = 'source-over';\n    g.save();\n    g.beginPath();\n    g.arc(cx, cy, R, 0, TAU);\n    g.clip();\n\n    // base hot color\n    const base = g.createRadialGradient(cx-R*0.15, cy-R*0.15, R*0.1, cx, cy, R*1.05);\n    base.addColorStop(0, '#ffffff');\n    base.addColorStop(0.4, sub.accent);\n    base.addColorStop(0.85, sub.color);\n    base.addColorStop(1, sub.deep);\n    g.fillStyle = base;\n    g.fillRect(cx-R, cy-R, R*2, R*2);\n\n    // granulation cells — many tiny mottled blobs\n    g.globalCompositeOperation = 'overlay';\n    const cells = Math.floor(R*R*0.55);\n    for (let i=0; i<cells; i++) {\n      // bias toward disk center, but allow edges\n      const u = rng(), v = rng();\n      const r = Math.sqrt(u) * R * 0.98;\n      const a = v * TAU;\n      const x = cx + Math.cos(a)*r;\n      const y = cy + Math.sin(a)*r;\n      const sz = 0.8 + rng()*2.4;\n      const bright = rng();\n      const col = bright > 0.55\n        ? hexA(sub.accent, 0.08 + rng()*0.18)\n        : hexA(sub.deep, 0.06 + rng()*0.18);\n      g.fillStyle = col;\n      g.beginPath(); g.arc(x, y, sz, 0, TAU); g.fill();\n    }\n\n    // sunspots (a few darker cool patches)\n    g.globalCompositeOperation = 'multiply';\n    const spots = 3 + Math.floor(rng()*3);\n    for (let i=0; i<spots; i++) {\n      const u = rng(), v = rng();\n      const r = Math.sqrt(u) * R * 0.7;\n      const a = v * TAU;\n      const x = cx + Math.cos(a)*r;\n      const y = cy + Math.sin(a)*r;\n      const sz = R * (0.05 + rng()*0.10);\n      const sg = g.createRadialGradient(x, y, 0, x, y, sz);\n      sg.addColorStop(0, hexA(sub.deep, 0.85));\n      sg.addColorStop(0.6, hexA(sub.deep, 0.35));\n      sg.addColorStop(1, 'rgba(0,0,0,0)');\n      g.fillStyle = sg;\n      g.beginPath(); g.arc(x, y, sz, 0, TAU); g.fill();\n    }\n\n    // limb darkening (cool ring at edge)\n    g.globalCompositeOperation = 'source-over';\n    const limb = g.createRadialGradient(cx, cy, R*0.85, cx, cy, R);\n    limb.addColorStop(0, 'rgba(0,0,0,0)');\n    limb.addColorStop(1, hexA(sub.deep, 0.55));\n    g.fillStyle = limb;\n    g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();\n\n    // bright limb highlight on lit-shoulder\n    const hi = g.createRadialGradient(cx-R*0.5, cy-R*0.5, 0, cx-R*0.3, cy-R*0.3, R*0.9);\n    hi.addColorStop(0, 'rgba(255,255,255,0.55)');\n    hi.addColorStop(0.5, 'rgba(255,255,255,0.0)');\n    g.fillStyle = hi;\n    g.fillRect(cx-R, cy-R, R*2, R*2);\n\n    g.restore();\n\n    // hot white overdrive at very center\n    g.globalCompositeOperation = 'lighter';\n    const core = g.createRadialGradient(cx, cy, 0, cx, cy, R*0.55);\n    core.addColorStop(0, 'rgba(255,255,255,0.95)');\n    core.addColorStop(0.5, 'rgba(255,255,255,0.25)');\n    core.addColorStop(1, 'rgba(255,255,255,0)');\n    g.fillStyle = core;\n    g.beginPath(); g.arc(cx, cy, R*0.55, 0, TAU); g.fill();\n    g.globalCompositeOperation = 'source-over';\n\n    return { canvas: c, R, size, cx, cy };\n  }\n\n  // ─── PLANET TEXTURE ──────────────────────────────────────\n  function rebuildPlanets() {\n    planetTextures.length = 0;\n    planets.forEach((p, i) => planetTextures.push(buildPlanetTexture(p, i)));\n  }\n\n  function buildPlanetTexture(p, idx) {\n    // Build a SURFACE MAP — a wide, unshaded 2:1 strip representing the planet's\n    // surface unrolled (equirectangular-ish). At draw time we'll scroll it\n    // horizontally to spin the planet, then apply directional shading.\n    const R = Math.max(8, Math.round(p.size * 4));\n    const stripW = R * 4; // 2× the body width so we can scroll-wrap\n    const stripH = R * 2;\n\n    // surface = unshaded body texture, drawn into a flat rectangle\n    const surface = document.createElement('canvas');\n    surface.width = stripW; surface.height = stripH;\n    const sg = surface.getContext('2d');\n    const rng = mulberry32(idx*7919 + 31);\n\n    // base color\n    sg.fillStyle = p.deep;\n    sg.fillRect(0, 0, stripW, stripH);\n\n    if (p.kind === 'gas') {\n      const bands = 14 + Math.floor(rng()*6);\n      for (let i=0; i<bands; i++) {\n        const y = (i/bands)*stripH;\n        const h = (stripH/bands) * (0.7 + rng()*0.6);\n        const tone = rng();\n        let col;\n        if (tone < 0.45) col = hexA(p.hue, 0.55 + rng()*0.25);\n        else if (tone < 0.8) col = hexA(p.deep, 0.4 + rng()*0.3);\n        else col = hexA('#ffffff', 0.06 + rng()*0.08);\n        sg.fillStyle = col;\n        sg.beginPath();\n        const segs = 48;\n        sg.moveTo(0, y);\n        for (let s=0; s<=segs; s++) {\n          const xx = (s/segs)*stripW;\n          const yy = y + Math.sin(s*0.4 + i*1.3)*0.8;\n          sg.lineTo(xx, yy);\n        }\n        for (let s=segs; s>=0; s--) {\n          const xx = (s/segs)*stripW;\n          const yy = y + h + Math.sin(s*0.4 + i*1.3 + 1.1)*0.8;\n          sg.lineTo(xx, yy);\n        }\n        sg.closePath();\n        sg.fill();\n      }\n      // a great storm at a random longitude\n      if (rng() > 0.4) {\n        const sx = rng()*stripW;\n        const sy = stripH*(0.35 + rng()*0.3);\n        const sw = R*0.5, sh = R*0.22;\n        const sgr = sg.createRadialGradient(sx, sy, 0, sx, sy, sw);\n        sgr.addColorStop(0, hexA('#ffffff', 0.45));\n        sgr.addColorStop(0.4, hexA(p.hue, 0.55));\n        sgr.addColorStop(1, hexA(p.deep, 0));\n        sg.fillStyle = sgr;\n        sg.beginPath(); sg.ellipse(sx, sy, sw, sh, 0, 0, TAU); sg.fill();\n      }\n    } else if (p.kind === 'icy') {\n      const baseG = sg.createLinearGradient(0, 0, stripW, stripH);\n      baseG.addColorStop(0, hexA(p.hue, 0.95));\n      baseG.addColorStop(1, hexA(p.deep, 0.95));\n      sg.fillStyle = baseG;\n      sg.fillRect(0, 0, stripW, stripH);\n      // polar bands (top + bottom rows of strip = poles in equirectangular)\n      const polar = sg.createLinearGradient(0, 0, 0, stripH);\n      polar.addColorStop(0, 'rgba(255,255,255,0.55)');\n      polar.addColorStop(0.18, 'rgba(255,255,255,0.0)');\n      polar.addColorStop(0.82, 'rgba(255,255,255,0.0)');\n      polar.addColorStop(1, 'rgba(255,255,255,0.55)');\n      sg.fillStyle = polar;\n      sg.fillRect(0, 0, stripW, stripH);\n      // craters\n      const craters = 30 + Math.floor(rng()*20);\n      for (let i=0;i<craters;i++) {\n        const x = rng()*stripW;\n        // bias away from poles\n        const y = stripH*(0.18 + rng()*0.64);\n        const sz = 0.8 + rng()*2.6;\n        sg.fillStyle = hexA(p.deep, 0.4 + rng()*0.3);\n        sg.beginPath(); sg.arc(x, y, sz, 0, TAU); sg.fill k \"shadow continent\" at longitude ~180\n      const sx2 = stripW * 0.68;\n      const sy2 = stripH * (0.38 + rng()*0.24);\n      const sw2 = R * 0.55;\n      const sh2 = R * 0.28;\n      const g2 = sg.createRadialGradient(sx2, sy2, 0, sx2, sy2, sw2);\n      g2.addColorStop(0, hexA(p.deep, 0.95));\n      g2.addColorStop(0.5, hexA(p.deep, 0.55));\n      g2.addColorStop(1, hexA(p.deep, 0));\n      sg.fillStyle = g2;\n      sg.beginPath(); sg.ellipse(sx2, sy2, sw2, sh2, 0, 0, TAU); sg.fill();\n\n      // A bright vertical \"meridian streak\" — narrow & high-contrast, at longitude ~270\n      const mx = stripW * 0.42;\n      const mg = sg.createLinearGradient(mx - R*0.25, 0, mx + R*0.25, 0);\n      mg.addColorStop(0, hexA(p.hue, 0));\n      mg.addColorStop(0.5, hexA('#ffffff', 0.45));\n      mg.addColorStop(1, hexA(p.hue, 0));\n      sg.fillStyle = mg;\n      sg.fillRect(mx - R*0.25, stripH*0.15, R*0.5, stripH*0.7);\n    }\n\n    // Output canvas — we still return a placeholder body canvas of original size\n    // for the shading layer cache, but the actual rendering happens live in drawPlanet\n    // using the surface map.\n    const pad = Math.round(R*0.6);\n    const size = (R + pad) * 2;\n    const c = document.createElement('canvas');\n    c.width = c.height = size;\n    const cx = size/2, cy = size/2;\n    const g = c.getContext('2d');\n\n    // Skip baking — we'll draw live. Just keep surface + meta.\n    return { canvas: c, surface, stripW, stripH, R, size, cx, cy };\n\n    // (fallthrough below intentionally unreachable — kept for legacy reference)\n    g.save();\n    g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();\n\n    // base body color\n    g.fillStyle = p.deep;\n    g.fillRect(cx-R, cy-R, R*2, R*2);\n\n    // Surface based on kind\n    if (p.kind === 'gas') {\n      // horizontal bands with subtle wave\n      const bands = 14 + Math.floor(rng()*6);\n      for (let i=0; i<bands; i++) {\n        const y = -R + (i/bands)*R*2 + rng()*2;\n        const h = (R*2/bands) * (0.7 + rng()*0.6);\n        const tone = rng();\n        let col;\n        if (tone < 0.45) col = hexA(p.hue, 0.55 + rng()*0.25);\n        else if (tone < 0.8) col = hexA(p.deep, 0.4 + rng()*0.3);\n        else col = hexA('#ffffff', 0.06 + rng()*0.08);\n        g.fillStyle = col;\n        // subtly waved band\n        g.beginPath();\n        const segs = 24;\n        g.moveTo(cx - R, cy + y);\n        for (let s=0; s<=segs; s++) {\n          const xx = cx - R + (s/segs)*R*2;\n          const yy = cy + y + Math.sin(s*0.6 + i*1.3)*0.6;\n          g.lineTo(xx, yy);\n        }\n        for (let s=segs; s>=0; s--) {\n          const xx = cx - R + (s/segs)*R*2;\n          const yy = cy + y + h + Math.sin(s*0.6 + i*1.3 + 1.1)*0.6;\n          g.lineTo(xx, yy);\n        }\n        g.closePath();\n        g.fill();\n      }\n      // a great storm / spot\n      if (rng() > 0.4) {\n        const sx = cx + (rng()-0.5)*R*0.8;\n        const sy = cy + (rng()-0.5)*R*0.5;\n        const sw = R*0.32, sh = R*0.16;\n        const sg = g.createRadialGradient(sx, sy, 0, sx, sy, sw);\n        sg.addColorStop(0, hexA('#ffffff', 0.4));\n        sg.addColorStop(0.4, hexA(p.hue, 0.5));\n        sg.addColorStop(1, hexA(p.deep, 0));\n        g.fillStyle = sg;\n        g.beginPath(); g.ellipse(sx, sy, sw, sh, 0, 0, TAU); g.fill();\n      }\n    } else if (p.kind === 'icy') {\n      // pale base + crater-like pock marks + polar caps\n      const baseG = g.createLinearGradient(cx-R, cy-R, cx+R, cy+R);\n      baseG.addColorStop(0, hexA(p.hue, 0.95));\n      baseG.addColorStop(1, hexA(p.deep, 0.95));\n      g.fillStyle = baseG;\n      g.fillRect(cx-R, cy-R, R*2, R*2);\n      // polar caps\n      for (const py of [cy - R*0.85, cy + R*0.85]) {\n        const pg = g.createRadialGradient(cx, py, 0, cx, py, R*0.7);\n        pg.addColorStop(0, 'rgba(255,255,255,0.55)');\n        pg.addColorStop(0.6, 'rgba(255,255,255,0.15)');\n        pg.addColorStop(1, 'rgba(255,255,255,0)');\n        g.fillStyle = pg;\n        g.beginPath(); g.arc(cx, py, R*0.7, 0, TAU); g.fill();\n      }\n      // craters\n      const craters = 18 + Math.floor(rng()*12);\n      for (let i=0;i<craters;i++) {\n        const u = rng(), v = rng();\n        const r = Math.sqrt(u)*R*0.95;\n        const a = v*TAU;\n        const x = cx + Math.cos(a)*r;\n        const y = cy + Math.sin(a)*r;\n        const sz = 0.8 + rng()*2.6;\n        g.fillStyle = hexA(p.deep, 0.4 + rng()*0.3);\n        g.beginPath(); g.arc(x, y, sz, 0, TAU); g.fill();\n        g.fillStyle = hexA('#ffffff', 0.18 + rng()*0.25);\n        g.beginPath(); g.arc(x - sz*0.3, y - sz*0.3, sz*0.5, 0, TAU); g.fill();\n      }\n    } else {\n      // rocky — continent-like blotches\n      const baseG = g.createRadialGradient(cx-R*0.3, cy-R*0.3, 0, cx, cy, R);\n      baseG.addColorStop(0, hexA(p.hue, 0.95));\n      baseG.addColorStop(0.7, hexA(p.deep, 0.85));\n      baseG.addColorStop(1, hexA(p.deep, 1));\n      g.fillStyle = baseG;\n      g.fillRect(cx-R, cy-R, R*2, R*2);\n      // continents (random irregular blobs)\n      const blobs = 6 + Math.floor(rng()*5);\n      for (let i=0;i<blobs;i++) {\n        const u = rng(), v = rng();\n        const r = Math.sqrt(u)*R*0.9;\n        const a = v*TAU;\n        const x = cx + Math.cos(a)*r;\n        const y = cy + Math.sin(a)*r;\n        const sz = R*(0.18 + rng()*0.28);\n        g.fillStyle = hexA(p.deep, 0.5 + rng()*0.3);\n        g.beginPath();\n        const verts = 8;\n        for (let k=0;k<=verts;k++) {\n          const ang = (k/verts)*TAU;\n          const rr = sz * (0.6 + rng()*0.7);\n          const xx = x + Math.cos(ang)*rr;\n          const yy = y + Math.sin(ang)*rr;\n          if (k===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);\n        }\n        g.closePath(); g.fill();\n      }\n      // tiny noise\n      for (let i=0;i<R*R*0.25;i++) {\n        const u = rng(), v = rng();\n        const r = Math.sqrt(u)*R*0.98;\n        const a = v*TAU;\n        const x = cx + Math.cos(a)*r;\n        const y = cy + Math.sin(a)*r;\n        g.fillStyle = rng()>0.5 ? hexA('#ffffff', 0.05+rng()*0.06) : hexA('#000000', 0.05+rng()*0.06);\n        g.fillRect(x, y, 1, 1);\n      }\n    }\n\n    // SHADING — directional lit/dark.\n    // Light comes from \"top-left\" in texture space. We'll later rotate the\n    // texture so top-left points to the sun.\n    // Day-side highlight (offset radial gradient)\n    const lit = g.createRadialGradient(cx - R*0.5, cy - R*0.5, R*0.05, cx, cy, R*1.05);\n    lit.addColorStop(0, 'rgba(255,255,255,0.55)');\n    lit.addColorStop(0.35, 'rgba(255,255,255,0.0)');\n    g.fillStyle = lit;\n    g.fillRect(cx-R, cy-R, R*2, R*2);\n\n    // Dark side gradient — strong falloff\n    const dark = g.createLinearGradient(cx - R*0.7, cy - R*0.7, cx + R*0.9, cy + R*0.9);\n    dark.addColorStop(0, 'rgba(0,0,0,0)');\n    dark.addColorStop(0.55, 'rgba(0,0,0,0.0)');\n    dark.addColorStop(0.75, 'rgba(0,0,0,0.55)');\n    dark.addColorStop(1, 'rgba(0,0,0,0.92)');\n    g.fillStyle = dark;\n    g.fillRect(cx-R, cy-R, R*2, R*2);\n\n    // limb / atmosphere on lit side\n    const rim = g.createRadialGradient(cx, cy, R*0.92, cx, cy, R);\n    rim.addColorStop(0, 'rgba(0,0,0,0)');\n    rim.addColorStop(1, hexA(p.hue, 0.4));\n    g.fillStyle = rim;\n    g.fillRect(cx-R, cy-R, R*2, R*2);\n\n    g.restore();\n\n    // crescent atmosphere glow on lit edge (outside body)\n    g.save();\n    g.globalCompositeOperation = 'lighter';\n    const atmo = g.createRadialGradient(cx - R*0.4, cy - R*0.4, R*0.6, cx - R*0.2, cy - R*0.2, R*1.35);\n    atmo.addColorStop(0, hexA(p.hue, 0));\n    atmo.addColorStop(0.6, hexA(p.hue, 0.18));\n    atmo.addColorStop(1, hexA(p.hue, 0));\n    g.fillStyle = atmo;\n    // mask outside body\n    g.beginPath();\n    g.arc(cx, cy, R*1.35, 0, TAU);\n    g.arc(cx, cy, R*1.0, 0, TAU, true);\n    g.fill('evenodd');\n    g.restore();\n\n    return { canvas: c, R, size, cx, cy };\n  }\n\n  // ─────────────────── KEPLER ───────────────────\n  // Solve Kepler's equation: E - e*sin(E) = M, returns true anomaly + radius\n  function solveKepler(M, e) {\n    let E = M;\n    for (let i=0; i<5; i++) {\n      E = E - (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));\n    }\n    const cosE = Math.cos(E), sinE = Math.sin(E);\n    const x = cosE - e;\n    const y = Math.sqrt(1-e*e) * sinE;\n    return { x, y }; // unit ellipse coords (focus at origin), scaled later\n  }\n\n  // ─────────────────── DRAW ───────────────────\n  function drawNebula() {\n    if (nebulaCanvas) ctx.drawImage(nebulaCanvas, 0, 0);\n  }\n\n  function drawStarLayer(list, t, parallax) {\n    for (let i=0; i<list.length; i++) {\n      const s = list[i];\n      const tw = 0.7 + 0.3 * Math.sin(t * s.tws + s.tw);\n      const a = s.b * tw;\n      ctx.fillStyle = hexA(s.tint, a);\n      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();\n      if (s.b > 0.85 && s.r > 1.1) {\n        ctx.strokeStyle = hexA(s.tint, a * 0.45);\n        ctx.lineWidth = 0.6;\n        ctx.beginPath();\n        ctx.moveTo(s.x - s.r*3.5, s.y); ctx.lineTo(s.x + s.r*3.5, s.y);\n        ctx.moveTo(s.x, s.y - s.r*3.5); ctx.lineTo(s.x, s.y + s.r*3.5);\n        ctx.stroke();\n      }\n    }\n  }\n\n  function drawConstellations() {\n    ctx.strokeStyle = 'rgba(255,255,255,0.035)';\n    ctx.lineWidth = 0.7;\n    constellations.forEach(chain => {\n      ctx.beginPath();\n      for (let i=0; i<chain.length; i++) {\n        const s = starsFrontData[chain[i]];\n        if (i===0) ctx.moveTo(s.x, s.y);\n        else ctx.lineTo(s.x, s.y);\n      }\n      ctx.stroke();\n    });\n  }\n\n  function drawOrbitEllipse(cx, cy, a, e, w, inc) {\n    // semi-major a (px), eccentricity e, arg of periapsis w (radians), inclination scales y\n    const b = a * Math.sqrt(1 - e*e);\n    const cExp = a * e; // distance from center to focus\n    ctx.save();\n    ctx.translate(cx, cy);\n    ctx.rotate(w);\n    // sun is at focus → ellipse center is at (-cExp, 0) in this rotated frame\n    ctx.translate(-cExp, 0);\n    ctx.scale(1, inc);\n    ctx.strokeStyle = 'rgba(199,210,254,0.05)';\n    ctx.lineWidth = 1;\n    ctx.setLineDash([2, 4]);\n    ctx.beginPath();\n    ctx.arc(0, 0, 1, 0, TAU); // unit\n    ctx.restore();\n\n    // we need the ellipse with semi-axes a,b (after y-scale by inc, b → b*inc).\n    // The above unit-arc trick won't correctly draw because of scale stacking; redo simply:\n    ctx.save();\n    ctx.translate(cx, cy);\n    ctx.rotate(w);\n    ctx.translate(-cExp, 0);\n    ctx.strokeStyle = 'rgba(199,210,254,0.055)';\n    ctx.lineWidth = 1;\n    ctx.setLineDash([2, 4]);\n    ctx.beginPath();\n    ctx.ellipse(0, 0, a, b * inc, 0, 0, TAU);\n    ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.restore();\n  }\n\n  function drawSun(x, y, sub, tex, t) {\n    const pulse = 1 + Math.sin(t*0.5 + sub.pulseT)*0.04;\n    const drawSize = tex.size * pulse;\n    ctx.save();\n    // additive blend so coronas combine nicely\n    ctx.globalCompositeOperation = 'lighter';\n    ctx.translate(x, y);\n    // very slow self-rotation for surface motion\n    ctx.rotate(t * 0.02 + sub.pulseT * 0.1);\n    ctx.drawImage(tex.canvas, -drawSize/2, -drawSize/2, drawSize, drawSize);\n    ctx.restore();\n\n    // bright god-ray bloom (separate, full alpha)\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    const R = sub.radius * pulse;\n    const bloom = ctx.createRadialGradient(x, y, 0, x, y, R*9);\n    bloom.addColorStop(0, hexA(sub.accent, 0.18));\n    bloom.addColorStop(0.25, hexA(sub.color, 0.10));\n    bloom.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.fillStyle = bloom;\n    ctx.beginPath(); ctx.arc(x, y, R*9, 0, TAU); ctx.fill();\n    ctx.restore();\n  }\n\n  function drawPlanet(p, tex, sunX, sunY, px, py, t, planetIdx) {\n    // Direction from planet to sun in world coords (for lighting)\n    const angToSun = Math.atan2(sunY - py, sunX - px);\n\n    const R = p.size;\n\n    // Soft shadow/glow underneath\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    const glow = ctx.createRadialGradient(px, py, 0, px, py, R*3.0);\n    glow.addColorStop(0, hexA(p.hue, 0.18));\n    glow.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.fillStyle = glow;\n    ctx.beginPath(); ctx.arc(px, py, R*3.0, 0, TAU); ctx.fill();\n    ctx.restore();\n\n    // Ring tilt — independent of lighting, set per-planet\n    const ringTilt = 0.3 + (planetIdx * 0.17);\n\n    // Ring (back half)\n    if (p.ring) {\n      ctx.save();\n      ctx.translate(px, py);\n      ctx.rotate(ringTilt);\n      ctx.scale(1, 0.32);\n      const rg = ctx.createRadialGradient(0, 0, R*1.45, 0, 0, R*2.2);\n      rg.addColorStop(0, 'rgba(0,0,0,0)');\n      rg.addColorStop(0.4, hexA(p.ringColor, 0.55));\n      rg.addColorStop(0.65, hexA(p.ringColor, 0.7));\n      rg.addColorStop(0.9, hexA(p.ringColor, 0.25));\n      rg.addColorStop(1, 'rgba(0,0,0,0)');\n      ctx.strokeStyle = rg;\n      ctx.lineWidth = R*0.9;\n      ctx.beginPath();\n      ctx.arc(0, 0, R*1.85, Math.PI, TAU);\n      ctx.stroke();\n      ctx.strokeStyle = hexA('#ffffff', 0.18);\n      ctx.lineWidth = 0.8;\n      ctx.beginPath();\n      ctx.arc(0, 0, R*1.85, Math.PI, TAU);\n      ctx.stroke();\n      ctx.restore();\n    }\n\n    // ─── BODY: live render with axial spin + directional shading ───\n    // Spin rate (radians/sec equivalent — clearly visible). Smaller planets faster.\n    // Cinematic spin — slow & graceful. Smaller planets a touch faster.\n    const spinRate = 0.09 + 0.55 / p.size;\n    // Map strip height to body diameter (2R). The strip is stripW wide; we want\n    // the visible window width = 2R to scroll across the whole strip every cycle.\n    // Choose drawW = stripW scaled so 1 cycle of strip = full surface seen once.\n    const drawH = R * 2;\n    const drawW = drawH * 2; // window width (2R) is half of strip-width (4R) → full rotation visible\n    // sx = how far the strip has scrolled, in body-pixel space (0..drawW = one full rotation)\n    const sx = ((t * spinRate + planetIdx * 0.9) % 1) * drawW;\n\n    ctx.save();\n    ctx.beginPath();\n    ctx.arc(px, py, R, 0, TAU);\n    ctx.clip();\n\n    // Solid base fill so body is never translucent (covers any strip-tile gaps)\n    ctx.fillStyle = p.deep;\n    ctx.fillRect(px - R, py - R, R*2, R*2);\n\n    // For ringed planets: rotate surface so spin axis aligns with ring plane.\n    if (p.ring) {\n      ctx.translate(px, py);\n      ctx.rotate(ringTilt);\n      ctx.translate(-px, -py);\n    }\n\n    const x0 = px - R - sx;\n    const y0 = py - drawH/2;\n    // Draw 5 wrapped copies for guaranteed coverage on any rotation\n    ctx.drawImage(tex.surface, x0 - drawW, y0, drawW, drawH);\n    ctx.drawImage(tex.surface, x0, y0, drawW, drawH);\n    ctx.drawImage(tex.surface, x0 + drawW, y0, drawW, drawH);\n    ctx.drawImage(tex.surface, x0 + drawW*2, y0, drawW, drawH);\n    ctx.drawImage(tex.surface, x0 + drawW*3, y0, drawW, drawH);\n\n    // Reset rotation for shading layers (they should follow world-space sun direction)\n    if (p.ring) {\n      ctx.translate(px, py);\n      ctx.rotate(-ringTilt);\n      ctx.translate(-px, -py);\n    }\n\n    // (No edge fade — keep the body 100% opaque to its silhouette.\n    //  Roundness comes from the lit-side highlight + dark-side shadow.)\n\n    // Lit hemisphere highlight — points toward sun\n    const lx = Math.cos(angToSun), ly = Math.sin(angToSun);\n    const litCx = px + lx * R * 0.45;\n    const litCy = py + ly * R * 0.45;\n    const lit = ctx.createRadialGradient(litCx, litCy, R*0.05, px, py, R*1.1);\n    lit.addColorStop(0, 'rgba(255,255,255,0.45)');\n    lit.addColorStop(0.4, 'rgba(255,255,255,0.0)');\n    ctx.fillStyle = lit;\n    ctx.fillRect(px - R, py - R, R*2, R*2);\n\n    // Dark side — proper Lambertian terminator using a linear gradient\n    // perpendicular to the sun direction. Solid black on the unlit hemisphere,\n    // soft fall-through on the lit side. No translucency anywhere on the body.\n    const termAng = angToSun + Math.PI / 2; // perpendicular to sun direction\n    const tx0 = px + Math.cos(angToSun) * R;       // fully lit point\n    const ty0 = py + Math.sin(angToSun) * R;\n    const tx1 = px - Math.cos(angToSun) * R;       // fully dark point\n    const ty1 = py - Math.sin(angToSun) * R;\n    const dark = ctx.createLinearGradient(tx0, ty0, tx1, ty1);\n    dark.addColorStop(0, 'rgba(0,0,0,0)');\n    dark.addColorStop(0.45, 'rgba(0,0,0,0)');\n    dark.addColorStop(0.55, 'rgba(0,0,0,0.55)');\n    dark.addColorStop(1.0, 'rgba(0,0,0,0.92)');\n    ctx.fillStyle = dark;\n    ctx.fillRect(px - R, py - R, R*2, R*2);\n\n    // (Rim atmosphere removed — was creating ghostly edges; the crescent\n    //  glow drawn outside the body after the clip is unclipped handles this.)\n\n    ctx.restore();\n\n    // Crescent atmosphere glow OUTSIDE the body on lit edge\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    const atmoCx = px + lx * R * 0.3;\n    const atmoCy = py + ly * R * 0.3;\n    const atmo = ctx.createRadialGradient(atmoCx, atmoCy, R*0.7, atmoCx, atmoCy, R*1.45);\n    atmo.addColorStop(0, hexA(p.hue, 0));\n    atmo.addColorStop(0.55, hexA(p.hue, 0.20));\n    atmo.addColorStop(1, hexA(p.hue, 0));\n    ctx.fillStyle = atmo;\n    ctx.beginPath();\n    ctx.arc(px, py, R*1.45, 0, TAU);\n    ctx.arc(px, py, R*1.0, 0, TAU, true);\n    ctx.fill('evenodd');\n    ctx.restore();\n\n    // Ring (front half)\n    if (p.ring) {\n      ctx.save();\n      ctx.translate(px, py);\n      ctx.rotate(ringTilt);\n      ctx.scale(1, 0.32);\n      const rg = ctx.createRadialGradient(0, 0, R*1.45, 0, 0, R*2.2);\n      rg.addColorStop(0, 'rgba(0,0,0,0)');\n      rg.addColorStop(0.4, hexA(p.ringColor, 0.7));\n      rg.addColorStop(0.65, hexA(p.ringColor, 0.85));\n      rg.addColorStop(0.9, hexA(p.ringColor, 0.3));\n      rg.addColorStop(1, 'rgba(0,0,0,0)');\n      ctx.strokeStyle = rg;\n      ctx.lineWidth = R*0.9;\n      ctx.beginPath();\n      ctx.arc(0, 0, R*1.85, 0, Math.PI);\n      ctx.stroke();\n      ctx.strokeStyle = hexA('#ffffff', 0.25);\n      ctx.lineWidth = 0.8;\n      ctx.beginPath();\n      ctx.arc(0, 0, R*1.85, 0, Math.PI);\n      ctx.stroke();\n      ctx.restore();\n    }\n  }\n\n  // ─────────────────── INTERACTION ───────────────────\n  let dragging = false, lastX = 0;\n  let globalRot = 0;\n  let dragRot = 0;\n  let dragVel = 0;\n\n  canvas.addEventListener('pointerdown', (e) => {\n    dragging = true; lastX = e.clientX;\n    dragVel = 0;\n    canvas.setPointerCapture(e.pointerId);\n  });\n  canvas.addEventListener('pointermove', (e) => {\n    if (!dragging) return;\n    const dx = e.clientX - lastX;\n    lastX = e.clientX;\n    dragRot += dx * 0.003;\n    dragVel = dx * 0.003;\n  });\n  canvas.addEventListener('pointerup', () => { dragging = false; });\n  canvas.addEventListener('pointercancel', () => { dragging = false; });\n\n  // ─────────────────── ANIMATION ───────────────────\n  let startTime = performance.now();\n  const tcEl = document.getElementById('tc');\n  function fmtTC(ms) {\n    const total = Math.floor(ms / 1000);\n    const h = String(Math.floor(total / 3600)).padStart(2,'0');\n    const m = String(Math.floor((total % 3600) / 60)).padStart(2,'0');\n    const s = String(total % 60).padStart(2,'0');\n    return `T+${h}:${m}:${s}`;\n  }\n\n  // ─────────────────── METEORS (world-space) ───────────────────\n  // Meteors live in the rotating world's coordinate system, so they translate,\n  // rotate, and breathe with the camera — physically consistent with everything else.\n  const meteors = [];\n  function spawnMeteor() {\n    // Spawn far from the galactic center, traveling on a straight ballistic\n    // trajectory through the scene. World coords centered at (0,0).\n    const baseDist = Math.min(W, H);\n    const radius = baseDist * 0.85;\n    const ang = Math.random() * TAU;\n    const x = Math.cos(ang) * radius;\n    const y = Math.sin(ang) * radius;\n    // velocity points roughly toward (but offset from) center\n    const targetAng = ang + Math.PI + (Math.random() - 0.5) * 0.6;\n    const speed = 4.5 + Math.random()*2.5;\n    const vx = Math.cos(targetAng) * speed;\n    const vy = Math.sin(targetAng) * speed;\n    meteors.push({ x, y, vx, vy, life: 0, maxLife: 90 + Math.random()*40 });\n  }\n  function updateMeteors() {\n    if (Math.random() < 0.006 && meteors.length < 2) spawnMeteor();\n    const baseDist = Math.min(W, H);\n    const limit = baseDist * 1.1;\n    for (let i = meteors.length - 1; i >= 0; i--) {\n      const m = meteors[i];\n      m.x += m.vx; m.y += m.vy; m.life++;\n      if (m.life > m.maxLife || Math.hypot(m.x, m.y) > limit) meteors.splice(i, 1);\n    }\n  }\n  function drawMeteors() {\n    ctx.save();\n    ctx.globalCompositeOperation = 'lighter';\n    for (const m of meteors) {\n      const tailLen = 80;\n      // Fade in over first 15% of life, fade out over last 25%\n      const lifeT = m.life / m.maxLife;\n      let fade;\n      if (lifeT < 0.15) fade = lifeT / 0.15;\n      else if (lifeT > 0.75) fade = (1 - lifeT) / 0.25;\n      else fade = 1;\n      const tx = m.x - m.vx * (tailLen / Math.hypot(m.vx, m.vy));\n      const ty = m.y - m.vy * (tailLen / Math.hypot(m.vx, m.vy));\n      const grad = ctx.createLinearGradient(tx, ty, m.x, m.y);\n      grad.addColorStop(0, 'rgba(199,210,254,0)');\n      grad.addColorStop(0.7, hexA('#c7d2fe', 0.4*fade));\n      grad.addColorStop(1, hexA('#ffffff', 0.95*fade));\n      ctx.strokeStyle = grad;\n      ctx.lineWidth = 1.6;\n      ctx.lineCap = 'round';\n      ctx.beginPath();\n      ctx.moveTo(tx, ty);\n      ctx.lineTo(m.x, m.y);\n      ctx.stroke();\n      ctx.fillStyle = hexA('#ffffff', fade);\n      ctx.beginPath(); ctx.arc(m.x, m.y, 1.6, 0, TAU); ctx.fill();\n    }\n    ctx.restore();\n  }\n\n  function frame(now) {\n    const t = (now - startTime) / 1000;\n\n    // auto-rotate + decay drag inertia\n    globalRot += 0.00038;\n    if (!dragging) {\n      dragRot += dragVel;\n      dragVel *= 0.96;\n      if (Math.abs(dragVel) < 1e-4) dragVel = 0;\n    }\n    const rot = globalRot + dragRot;\n\n    // Cinematic camera breathe — tiny zoom + drift\n    const breathe = 1 + Math.sin(t * 0.18) * 0.012;\n    const driftX = Math.sin(t * 0.07) * 6;\n    const driftY = Math.cos(t * 0.05) * 4;\n\n    ctx.clearRect(0, 0, W, H);\n\n    // Background nebula (fixed)\n    drawNebula();\n\n    // Back stars (slow parallax counter-rotation)\n    ctx.save();\n    ctx.translate(W/2, H/2);\n    ctx.rotate(rot * 0.10);\n    ctx.translate(-W/2, -H/2);\n    drawStarLayer(starsBackData, t, 0.10);\n    ctx.restore();\n\n    // Front stars + constellations\n    ctx.save();\n    ctx.translate(W/2, H/2);\n    ctx.rotate(rot * 0.22);\n    ctx.translate(-W/2, -H/2);\n    drawConstellations();\n    drawStarLayer(starsFrontData, t, 0.22);\n    ctx.restore();\n\n    // ─ Solar systems ─\n    const cx = W/2, cy = H/2;\n    ctx.save();\n    ctx.translate(cx + driftX, cy + driftY);\n    ctx.scale(breathe, breathe);\n    ctx.rotate(rot);\n\n    // compute sun positions\n    const baseDist = Math.min(W, H);\n    const sunPos = subjects.map((s, i) => ({\n      x: sunLayout[i].nx * baseDist,\n      y: sunLayout[i].ny * baseDist,\n    }));\n\n    // ORBIT RINGS (very faint, ellipses)\n    planets.forEach(pl => {\n      const sp = sunPos[pl.sun];\n      drawOrbitEllipse(sp.x, sp.y, pl.a, pl.e, pl.w, pl.inc);\n    });\n\n    // PLANETS — Keplerian motion. mean motion n ~ sqrt(M)/a^1.5\n    const planetPos = planets.map(pl => {\n      const sub = subjects[pl.sun];\n      // base time scale — slower for larger axis\n      // Slowed: ~3× slower than before. Kepler's 3rd law: n = sqrt(M)/a^1.5\n      // Much slower. Kepler's 3rd law: n = sqrt(M)/a^1.5\n      // Gentle revolution — visible but unhurried.\n      const n = 0.075 * Math.sqrt(sub.mass) / Math.pow(pl.a / 60, 1.5);\n      const M = pl.M0 + t * n;\n      const k = solveKepler(M, pl.e);\n      // orbit-frame coords (focus at origin)\n      const ox = k.x * pl.a;\n      const oy = k.y * pl.a * pl.inc;\n      // rotate by argument of periapsis\n      const cw = Math.cos(pl.w), sw = Math.sin(pl.w);\n      const x = ox*cw - oy*sw;\n      const y = ox*sw + oy*cw;\n      const sp = sunPos[pl.sun];\n      return { px: sp.x + x, py: sp.y + y, sp, pl };\n    });\n\n    // depth sort by y (so closer planets render on top — fakes depth)\n    planetPos.sort((a, b) => a.py - b.py);\n\n    planetPos.forEach((pp, i) => {\n      const idx = planets.indexOf(pp.pl);\n      drawPlanet(pp.pl, planetTextures[idx], pp.sp.x, pp.sp.y, pp.px, pp.py, t, idx);\n    });\n\n    // SUNS (drawn last → shine on top)\n    subjects.forEach((sub, i) => {\n      const sp = sunPos[i];\n      drawSun(sp.x, sp.y, sub, sunTextures[i], t);\n    });\n\n    // Meteors live in the same world-space transform as the suns/planets/orbits,\n    // so they rotate, drift, and breathe with the camera — true universe motion.\n    updateMeteors();\n    drawMeteors();\n\n    ctx.restore();\n\n    // timecode\n    tcEl.textContent = fmtTC(now - startTime);\n\n    requestAnimationFrame(frame);\n  }\n\n  window.addEventListener('resize', resize, { passive: true });\n  resize();\n  requestAnimationFrame(frame);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
